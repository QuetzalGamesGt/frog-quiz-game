<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 Frog Quiz Psicoterapia Arcade</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

body {
  font-family: "Press Start 2P", monospace;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  text-align: center;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="%23fff" opacity="0.3"/><circle cx="80" cy="80" r="2" fill="%23fff" opacity="0.3"/></svg>');
  pointer-events: none;
  z-index: -1;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}

.quiz {
  background: rgba(0, 0, 0, 0.7);
  border: 4px solid #00ff00;
  border-radius: 15px;
  padding: 30px;
  box-shadow: 0 0 30px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.1);
  animation: glow 2s ease-in-out infinite;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 0, 0.5), inset 0 0 20px rgba(0, 255, 0, 0.1); }
  50% { box-shadow: 0 0 50px rgba(0, 255, 0, 0.8), inset 0 0 30px rgba(0, 255, 0, 0.3); }
}

h1 {
  font-size: 28px;
  margin-bottom: 20px;
  text-shadow: 0 0 10px #00ff00;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.setup {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 20px;
}

.setup input,
.setup select,
.setup button {
  padding: 12px;
  font-size: 14px;
  font-family: "Press Start 2P", monospace;
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  color: #00ff00;
  cursor: pointer;
  transition: all 0.3s;
}

.setup input::placeholder {
  color: rgba(0, 255, 0, 0.5);
}

.setup input:focus,
.setup select:focus {
  outline: none;
  background: rgba(0, 255, 0, 0.3);
  box-shadow: 0 0 15px #00ff00;
}

.setup button {
  background: linear-gradient(45deg, #00ff00, #00cc00);
  color: #000;
  font-weight: bold;
  border-radius: 8px;
  transform: scale(1);
  transition: all 0.3s;
}

.setup button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #00ff00;
}

.setup button:active {
  transform: scale(0.95);
}

#hud {
  display: none;
  justify-content: space-around;
  margin-bottom: 30px;
  flex-wrap: wrap;
  gap: 20px;
}

.hud-item {
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  padding: 15px 25px;
  border-radius: 8px;
  font-size: 16px;
  min-width: 150px;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
}

.hud-item span {
  color: #00ff00;
  font-weight: bold;
  font-size: 20px;
  text-shadow: 0 0 10px #00ff00;
}

#question {
  font-size: 18px;
  margin: 30px 0;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  padding: 20px;
  border-radius: 8px;
  box-shadow: inset 0 0 15px rgba(0, 255, 0, 0.2);
}

.leaves {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 50px 0;
  position: relative;
  flex-wrap: wrap;
}

.leaf {
  width: 140px;
  height: 140px;
  background: linear-gradient(135deg, #2ecc71, #27ae60);
  cursor: pointer;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
  border-radius: 50%;
  border: 3px solid #00ff00;
  transition: all 0.2s;
  box-shadow: 0 0 15px rgba(46, 204, 113, 0.5);
  font-size: 12px;
  text-align: center;
  padding: 10px;
}

.leaf:hover {
  transform: scale(1.1);
  box-shadow: 0 0 25px rgba(46, 204, 113, 0.9);
  background: linear-gradient(135deg, #27ae60, #1e8449);
}

.leaf:active {
  transform: scale(0.95);
}

#frog {
  position: absolute;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 70px;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 0 10px rgba(0, 255, 0, 0.8));
  z-index: 10;
}

.game-over {
  animation: bounce 0.6s ease-in-out;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

.result {
  margin-top: 30px;
  padding: 20px;
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  border-radius: 8px;
  font-size: 18px;
}

.result h2 {
  font-size: 24px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #00ff00;
}

.result p {
  margin: 10px 0;
  font-size: 16px;
}

.result button {
  margin-top: 15px;
  padding: 12px 25px;
  background: linear-gradient(45deg, #00ff00, #00cc00);
  color: #000;
  border: 2px solid #00ff00;
  font-family: "Press Start 2P", monospace;
  font-size: 12px;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
  transition: all 0.3s;
}

.result button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #00ff00;
}

.ranking {
  margin-top: 30px;
  background: rgba(0, 255, 0, 0.1);
  border: 2px solid #00ff00;
  padding: 20px;
  border-radius: 8px;
}

.ranking h3 {
  font-size: 18px;
  margin-bottom: 15px;
  text-shadow: 0 0 10px #00ff00;
}

.ranking-item {
  background: rgba(0, 0, 0, 0.5);
  padding: 10px;
  margin: 8px 0;
  border-left: 3px solid #00ff00;
  text-align: left;
  font-size: 12px;
  border-radius: 4px;
}

.progress-bar {
  width: 100%;
  height: 20px;
  background: rgba(0, 0, 0, 0.5);
  border: 2px solid #00ff00;
  border-radius: 8px;
  margin: 20px 0;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #00ff00, #00cc00);
  transition: width 0.3s;
  box-shadow: 0 0 10px #00ff00;
}

@media (max-width: 768px) {
  h1 { font-size: 20px; }
  .leaf { width: 100px; height: 100px; font-size: 10px; }
  #frog { font-size: 50px; }
  .hud-item { font-size: 12px; min-width: 100px; }
}
</style>
</head>
<body>

<div class="container">
  <div class="quiz">
    <h1>🐸 FROG QUIZ ARCADE 🐸</h1>
    
    <div class="setup" id="setup">
      <div style="font-size: 16px; margin-bottom: 10px;">⚙️ CONFIGURACIÓN DEL JUEGO</div>
      <input id="playerName" placeholder="Ingresa tu nombre">
      <select id="difficulty">
        <option value="easy">⭐ FÁCIL (12s - 5 vidas)</option>
        <option value="medium" selected>⭐⭐ MEDIO (8s - 3 vidas)</option>
        <option value="hard">⭐⭐⭐ DIFÍCIL (5s - 2 vidas)</option>
      </select>
      <button onclick="startGame()">▶️ COMENZAR JUEGO</button>
    </div>

    <div id="hud">
      <div class="hud-item">⏳ TIEMPO: <span id="time">10</span>s</div>
      <div class="hud-item">⭐ PUNTOS: <span id="points">0</span></div>
      <div class="hud-item">❤️ VIDAS: <span id="lives">3</span></div>
      <div class="hud-item">📊 PREGUNTA: <span id="current">1</span>/<span id="total">7</span></div>
    </div>

    <div class="progress-bar" id="progressBar" style="display:none;">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="question"></div>

    <div class="leaves" id="leaves">
      <div id="frog">🐸</div>
    </div>

    <div id="resultContainer"></div>
  </div>
</div>

<!-- 🎵 Sonidos -->
<audio id="bgmusic" loop volume="0.3">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d5a8f2c5b.mp3?filename=relaxing-music-ambient-11099.mp3" type="audio/mpeg">
</audio>
<audio id="jump" volume="0.5"><source src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" type="audio/ogg"></audio>
<audio id="success" volume="0.5"><source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg"></audio>
<audio id="fail" volume="0.5"><source src="https://actions.google.com/sounds/v1/cartoon/boing.ogg" type="audio/ogg"></audio>
<audio id="gameover" volume="0.5"><source src="https://actions.google.com/sounds/v1/cartoon/concussive_drum_hit.ogg" type="audio/ogg"></audio>

<script>
// 🎲 Pool expandido de preguntas sobre psicoterapia
const pool = [
  {q:"La psicoterapia ayuda solo en crisis graves", options:["Verdadero","Falso"], a:1},
  {q:"El terapeuta mantiene confidencialidad", options:["Verdadero","Falso"], a:0},
  {q:"La TCC trabaja pensamientos y conductas", options:["Verdadero","Falso"], a:0},
  {q:"Ir a terapia es debilidad", options:["Verdadero","Falso"], a:1},
  {q:"La alianza terapéutica influye en el éxito", options:["Verdadero","Falso"], a:0},
  {q:"El terapeuta juzga libremente al paciente", options:["Verdadero","Falso"], a:1},
  {q:"Existen varios enfoques terapéuticos", options:["Verdadero","Falso"], a:0},
  {q:"La terapia puede mejorar habilidades sociales", options:["Verdadero","Falso"], a:0},
  {q:"La psicoterapia es solo hablar sin objetivos", options:["Verdadero","Falso"], a:1},
  {q:"La terapia puede reducir ansiedad", options:["Verdadero","Falso"], a:0},
  {q:"La empatía es fundamental en terapia", options:["Verdadero","Falso"], a:0},
  {q:"El psicologo prescribe medicamentos", options:["Verdadero","Falso"], a:1},
  {q:"La terapia familiar incluye a todos los miembros", options:["Verdadero","Falso"], a:0},
  {q:"La resistencia del paciente es mala señal", options:["Verdadero","Falso"], a:1},
  {q:"La psicoterapia tiene base científica", options:["Verdadero","Falso"], a:0}
];

let quiz = [], current = 0, score = 0, lives = 3, log = [];
let time = 10, timer, player = "";
let gameActive = false;
let rankings = JSON.parse(localStorage.getItem('frogquizRankings')) || [];

function startGame() {
  player = document.getElementById("playerName").value || "Anónimo";
  let diff = document.getElementById("difficulty").value;
  
  if (diff === "easy") { time = 12; lives = 5; }
  if (diff === "medium") { time = 8; lives = 3; }
  if (diff === "hard") { time = 5; lives = 2; }
  
  document.getElementById("setup").style.display = "none";
  document.getElementById("hud").style.display = "flex";
  document.getElementById("progressBar").style.display = "block";
  document.getElementById("resultContainer").innerHTML = "";
  
  // Reproducir música
  document.getElementById("bgmusic").play().catch(e => console.log("Audio no disponible"));
  
  // Seleccionar preguntas aleatorias
  quiz = [...pool].sort(() => Math.random() - 0.5).slice(0, 7);
  document.getElementById("total").innerText = quiz.length;
  
  current = 0;
  score = 0;
  lives = lives;
  log = [];
  gameActive = true;
  
  document.getElementById("points").innerText = score;
  document.getElementById("lives").innerText = lives;
  
  load();
}

function startTimer() {
  let t = time;
  document.getElementById("time").innerText = t;
  clearInterval(timer);
  
  timer = setInterval(() => {
    t--;
    document.getElementById("time").innerText = t;
    
    if (t <= 0) {
      clearInterval(timer);
      if (gameActive) {
        loseLife("⏰ Sin responder");
        next();
      }
    }
  }, 1000);
}

function load() {
  if (!gameActive || lives <= 0) {
    return finish();
  }
  
  let q = quiz[current];
  document.getElementById("question").innerText = q.q;
  document.getElementById("current").innerText = current + 1;
  
  // Actualizar barra de progreso
  let progress = ((current + 1) / quiz.length) * 100;
  document.getElementById("progressFill").style.width = progress + "%";
  
  let container = document.getElementById("leaves");
  container.innerHTML = '<div id="frog">🐸</div>';
  
  let shuffled = q.options.map((opt, i) => ({ opt, i })).sort(() => Math.random() - 0.5);
  
  shuffled.forEach(item => {
    let leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.innerText = item.opt;
    leaf.onclick = () => answer(item.i, leaf);
    container.appendChild(leaf);
  });
  
  startTimer();
}

function answer(i, leaf) {
  if (!gameActive) return;
  
  clearInterval(timer);
  gameActive = false;
  
  let frog = document.getElementById("frog");
  let rect = leaf.getBoundingClientRect();
  let parentRect = leaf.parentElement.getBoundingClientRect();
  let x = rect.left - parentRect.left + rect.width / 2;
  let y = rect.top - parentRect.top;
  
  frog.style.left = x + "px";
  frog.style.top = (y - 70) + "px";
  
  document.getElementById("jump").play().catch(e => console.log("Sonido no disponible"));
  
  const isCorrect = i === quiz[current].a;
  const userAnswer = quiz[current].options[i];
  const correctAnswer = quiz[current].options[quiz[current].a];
  
  log.push({ q: quiz[current].q, user: userAnswer, correct: correctAnswer, result: isCorrect });
  
  if (isCorrect) {
    score += 10;
    leaf.style.background = "linear-gradient(135deg, #27ae60, #1e8449)";
    leaf.style.boxShadow = "0 0 25px #00ff00";
    document.getElementById("success").play().catch(e => console.log("Sonido no disponible"));
  } else {
    loseLife(userAnswer);
    leaf.style.background = "linear-gradient(135deg, #e74c3c, #c0392b)";
    leaf.style.boxShadow = "0 0 25px #ff0000";
    document.getElementById("fail").play().catch(e => console.log("Sonido no disponible"));
  }
  
  document.getElementById("points").innerText = score;
  document.getElementById("lives").innerText = lives;
  
  setTimeout(next, 800);
}

function loseLife(userAnswer) {
  lives--;
  if (lives < 0) lives = 0;
}

function next() {
  current++;
  if (current < quiz.length && lives > 0) {
    gameActive = true;
    load();
  } else {
    finish();
  }
}

function finish() {
  gameActive = false;
  clearInterval(timer);
  document.getElementById("bgmusic").pause();
  document.getElementById("gameover").play().catch(e => console.log("Sonido no disponible"));
  
  // Guardar en ranking
  let rank = { player, score, lives, date: new Date().toLocaleDateString() };
  rankings.push(rank);
  rankings.sort((a, b) => b.score - a.score);
  rankings = rankings.slice(0, 10);
  localStorage.setItem('frogquizRankings', JSON.stringify(rankings));
  
  let accuracy = log.length > 0 ? Math.round((log.filter(l => l.result).length / log.length) * 100) : 0;
  
  let html = `
    <div class="result">
      <h2>🏁 ¡JUEGO TERMINADO! 🏁</h2>
      <p>👤 Jugador: <strong>${player}</strong></p>
      <p>⭐ Puntos: <strong>${score}</strong></p>
      <p>❤️ Vidas restantes: <strong>${lives}</strong></p>
      <p>🎯 Precisión: <strong>${accuracy}%</strong></p>
      <p>📝 Preguntas respondidas: <strong>${log.length}/${quiz.length}</strong></p>
      <button onclick="downloadLog()">📥 Descargar Registro</button>
      <button onclick="location.reload()">🔄 Jugar de Nuevo</button>
    </div>
    
    <div class="ranking">
      <h3>🏆 TOP 10 JUGADORES 🏆</h3>
      ${rankings.map((r, i) => `
        <div class="ranking-item">
          <strong>#${i + 1}</strong> - ${r.player}: <span style="color:#00ff00;">${r.score}pts</span> (${r.date})
        </div>
      `).join('')}
    </div>
  `;
  
  document.getElementById("resultContainer").innerHTML = html;
  document.getElementById("hud").style.display = "none";
  document.getElementById("question").innerText = "";
  document.getElementById("leaves").innerHTML = '<div id="frog" class="game-over">🐸</div>';
}

function downloadLog() {
  let text = `REGISTRO DE JUEGO - ${player}\n`;
  text += `Puntos: ${score}\n`;
  text += `Vidas Restantes: ${lives}\n`;
  text += `Fecha: ${new Date().toLocaleString()}\n\n`;
  text += `PREGUNTAS Y RESPUESTAS:\n`;
  text += `${'='.repeat(60)}\n\n`;
  
  log.forEach((l, i) => {
    text += `${i + 1}. ${l.q}\n`;
    text += `   Tu respuesta: ${l.user} ${l.result ? '✓' : '✗'}\n`;
    text += `   Respuesta correcta: ${l.correct}\n\n`;
  });
  
  let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `frog-quiz-${player}-${Date.now()}.txt`;
  a.click();
}
</script>

</body>
</html>
